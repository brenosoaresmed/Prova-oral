<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Obesidade & SM — Plataforma Gamificada</title>
<style>
:root{
  --bg:#070b1a; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.11); --txt:#e9edff; --muted:#8b95b8;
  --green:#34d399; --red:#f87171; --yellow:#fbbf24; --cyan:#22d3ee;
  --violet:#a78bfa; --pink:#f472b6; --amber:#fbbf24; --blue:#60a5fa; --orange:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:
    radial-gradient(1100px 700px at 5% -10%, rgba(99,102,241,.22), transparent 60%),
    radial-gradient(900px 600px at 105% 5%, rgba(244,114,182,.15), transparent 60%),
    radial-gradient(900px 700px at 50% 110%, rgba(34,211,238,.10), transparent 60%),
    linear-gradient(180deg,#070b1a,#0a1026 55%,#070b1a);
  background-attachment:fixed;
  color:var(--txt); min-height:100vh; padding-bottom:90px;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1080px;margin:0 auto;padding:0 16px}

/* ---------- HEADER ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:rgba(7,11,26,.82);border-bottom:1px solid var(--border);
  margin:0 -16px 22px;padding:12px 16px;
}
.topbar-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.lvl{
  display:flex;align-items:center;gap:8px;margin-left:auto;
  background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(34,211,238,.18));
  border:1px solid rgba(139,150,255,.35);padding:6px 12px;border-radius:999px;
  font-size:12.5px;font-weight:800;white-space:nowrap;
}
.xpwrap{flex:1 1 220px;min-width:150px}
.xpmeta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.xpbar{height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.xpfill{
  height:100%;border-radius:999px;width:0%;
  background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);
  transition:width .7s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 14px rgba(167,139,250,.65);
}

/* ---------- CARDS ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;
  transition:.25s;
}
.card:hover{border-color:rgba(255,255,255,.2)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h4{font-size:13px;margin:12px 0 6px;color:var(--cyan)}
.card p,.card li{font-size:13.5px;line-height:1.65;color:#cfd6f5}
.card ul{padding-left:20px;margin:6px 0}
.card li{margin-bottom:4px}
b,strong{color:#fff}
.small{font-size:12px;color:var(--muted)}

/* ---------- MISSION GRID ---------- */
.hero{
  text-align:center;padding:26px 16px 20px;
}
.hero h1{font-size:clamp(22px,4.4vw,34px);font-weight:900;letter-spacing:-.5px;line-height:1.15;
  background:linear-gradient(100deg,#22d3ee,#a78bfa 45%,#f472b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--muted);font-size:13.5px;margin-top:8px}
.pillrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pill{font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;letter-spacing:.4px}
.pill.r{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
.pill.y{background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.32)}
.pill.g{background:rgba(52,211,153,.14);color:#6ee7b7;border:1px solid rgba(52,211,153,.32)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;margin-top:16px}
.mission{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px 16px;cursor:pointer;transition:.25s cubic-bezier(.22,1,.36,1);overflow:hidden;
}
.mission::before{content:'';position:absolute;inset:0;opacity:0;transition:.3s;
  background:radial-gradient(220px 140px at 50% 0%,var(--mc),transparent 70%)}
.mission:hover{transform:translateY(-4px);border-color:var(--mc);box-shadow:0 14px 40px -12px var(--mc)}
.mission:hover::before{opacity:.22}
.mission.done{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.06)}
.mission-top{display:flex;align-items:center;gap:11px;margin-bottom:9px;position:relative}
.m-icon{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;
  background:linear-gradient(135deg,var(--mc),transparent 140%);
  border:1px solid var(--mc);box-shadow:0 0 22px -6px var(--mc);flex:none;
}
.m-num{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:1.2px}
.m-title{font-size:13.5px;font-weight:800;line-height:1.3;position:relative}
.m-prog{margin-top:12px;position:relative}
.m-prog .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.m-prog .fill{height:100%;background:linear-gradient(90deg,var(--mc),#fff6);border-radius:99px;transition:width .6s;width:0}
.m-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:700}
.checkmark{position:absolute;top:10px;right:12px;font-size:15px;opacity:0;transition:.3s}
.mission.done .checkmark{opacity:1}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:7px;margin:0 0 16px;flex-wrap:wrap}
.tab{
  padding:9px 15px;border-radius:11px;background:var(--card);border:1px solid var(--border);
  font-size:12.5px;font-weight:800;cursor:pointer;transition:.2s;color:var(--muted);
}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.tab.on{background:linear-gradient(135deg,rgba(99,102,241,.4),rgba(34,211,238,.22));color:#fff;border-color:rgba(139,150,255,.6)}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;margin:9px 0;font-size:12.5px}
th{background:rgba(255,255,255,.07);padding:9px 10px;text-align:left;font-weight:800;font-size:11.5px;
  letter-spacing:.4px;color:#b9c2e8;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#cfd6f5;line-height:1.5}
tr:hover td{background:rgba(255,255,255,.03)}
td:first-child{font-weight:700;color:#fff}

/* ---------- QUIZ ---------- */
.qbox{
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;
}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.qnum{
  font-size:10.5px;font-weight:900;padding:4px 9px;border-radius:7px;
  background:rgba(99,102,241,.22);color:#a5b4fc;border:1px solid rgba(99,102,241,.4);letter-spacing:.6px;flex:none;
}
.qtext{font-size:14px;font-weight:700;line-height:1.5;color:#fff}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.opt{
  text-align:left;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);color:#cfd6f5;font-size:13px;cursor:pointer;
  transition:.18s;display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-family:inherit;
}
.opt:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt .ltr{
  font-weight:900;font-size:11px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);flex:none;margin-top:1px;
}
.opt.correct{background:rgba(52,211,153,.15);border-color:var(--green);color:#a7f3d0}
.opt.correct .ltr{background:var(--green);color:#04241a}
.opt.wrong{background:rgba(248,113,113,.13);border-color:var(--red);color:#fecaca}
.opt.wrong .ltr{background:var(--red);color:#2b0808}
.opt.dim{opacity:.45}
.explain{
  margin-top:12px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.6;
  background:rgba(34,211,238,.08);border-left:3px solid var(--cyan);color:#b8e6f2;
  animation:slideIn .35s ease;
}
.explain.gold{background:rgba(251,191,36,.08);border-left-color:var(--yellow);color:#fde9a8}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- CALLOUTS ---------- */
.gold,.warn,.err,.ok{border-radius:12px;padding:12px 14px;margin:11px 0;font-size:12.8px;line-height:1.6;border-left:3px solid}
.gold{background:rgba(251,191,36,.09);border-color:var(--yellow);color:#fde9a8}
.warn{background:rgba(248,113,113,.08);border-color:var(--red);color:#fecaca}
.err{background:rgba(244,114,182,.08);border-color:var(--pink);color:#fbcfe8}
.ok{background:rgba(52,211,153,.08);border-color:var(--green);color:#a7f3d0}

/* ---------- BUTTONS ---------- */
.btn{
  padding:11px 20px;border-radius:12px;border:1px solid var(--border);background:var(--card2);
  color:#fff;font-weight:800;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;
}
.btn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.btn.primary{background:linear-gradient(135deg,#6366f1,#22d3ee);border:none;box-shadow:0 8px 26px -8px #6366f1}
.btn.primary:hover{box-shadow:0 12px 34px -8px #22d3ee}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:11.5px;border-radius:9px}

/* ---------- BONUS ---------- */
.acc{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc-h{padding:14px 16px;cursor:pointer;display:flex;gap:11px;align-items:center;font-size:13px;font-weight:800;transition:.2s}
.acc-h:hover{background:rgba(255,255,255,.05)}
.acc-h .chev{margin-left:auto;transition:.3s;color:var(--muted);font-size:12px}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 16px}
.acc.open .acc-b{max-height:900px;padding:0 16px 16px}

/* ---------- FLASHCARD ---------- */
.fc{
  perspective:1200px;height:210px;cursor:pointer;margin-bottom:16px;
}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;border:1px solid var(--border);background:var(--card);
}
.fc-front{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(34,211,238,.08));border-color:rgba(139,150,255,.4)}
.fc-back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(34,211,238,.06));border-color:rgba(52,211,153,.4)}
.fc-q{font-size:16px;font-weight:800;line-height:1.45}
.fc-a{font-size:14px;font-weight:700;color:#a7f3d0;line-height:1.6}
.fc-hint{font-size:10.5px;color:var(--muted);margin-top:14px;letter-spacing:.8px;font-weight:700}

/* ---------- CHEATSHEET ---------- */
.search{
  width:100%;padding:13px 16px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  color:#fff;font-size:13.5px;font-family:inherit;margin-bottom:14px;outline:none;
}
.search:focus{border-color:rgba(139,150,255,.6);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.cs-row{display:flex;gap:12px;padding:11px 14px;border-radius:10px;background:var(--card);
  border:1px solid var(--border);margin-bottom:7px;font-size:13px;align-items:center}
.cs-k{font-weight:800;color:#a5b4fc;flex:0 0 40%;font-size:12.5px}
.cs-v{color:#dbe2ff;flex:1;line-height:1.5}

/* ---------- MISC ---------- */
.back{margin-bottom:14px}
.mission-head{
  border-radius:18px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--mc) 0%,transparent 75%);
  border:1px solid var(--mc);
}
.mission-head::after{content:'';position:absolute;inset:0;background:rgba(7,11,26,.72);z-index:0}
.mission-head>*{position:relative;z-index:1}
.mission-head h2{font-size:20px;font-weight:900;margin-bottom:5px}
.mission-head p{font-size:12.5px;color:#c3cbe8}

.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;color:var(--cyan)}
.timer.danger{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

.confetti{position:fixed;top:-24px;width:9px;height:14px;z-index:9999;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(760deg);opacity:.15}}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;padding:12px 22px;border-radius:14px;
  font-weight:900;font-size:13.5px;z-index:9998;box-shadow:0 14px 40px -10px #6366f1;
  opacity:0;transition:.4s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.progress-dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.pd{width:22px;height:5px;border-radius:99px;background:rgba(255,255,255,.13)}
.pd.ok{background:var(--green)}
.pd.no{background:var(--red)}
.pd.now{background:var(--cyan);animation:pulse 1.4s infinite}

.fab{
  position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#22d3ee);border:none;color:#fff;font-size:23px;
  cursor:pointer;box-shadow:0 10px 34px -8px #6366f1;z-index:60;transition:.25s;display:grid;place-items:center;
}
.fab:hover{transform:scale(1.09) rotate(8deg)}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .cs-k{flex:0 0 100%}
  .cs-row{flex-direction:column;gap:3px}
  .brand{font-size:13px}
}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" title="Revisão rápida">⚡</button>

<script>
/* ═══════════════════════════════════════════════════════════════
   DADOS
   ═══════════════════════════════════════════════════════════════ */

const MISSIONS = [
{
  id:1, icon:"🌍", color:"#22d3ee", title:"Visão Geral e Epidemiologia", prio:"g",
  sub:"Definição, doença crônica e números",
  content:[
    {h:"Definição de Obesidade", b:`
      <p><b>Obesidade</b> = doença <b>crônica, recidivante e progressiva</b>, caracterizada por excesso de adiposidade que prejudica a saúde.</p>
      <ul>
        <li>Reconhecida como doença pela <b>OMS (1997)</b> e pela <b>AMA (2013)</b>.</li>
        <li>Não é falha de vontade — é <b>doença multifatorial</b> com base genética, ambiental e neuroendócrina.</li>
      </ul>
      <div class="gold">💎 <b>Dica de Ouro:</b> "A obesidade é uma pandemia?" → <b>Sim.</b> A OMS considera pandemia global, com projeção de 1 em cada 4 pessoas com obesidade até 2035.</div>
    `},
    {h:"Epidemiologia — números que caem em prova", b:`
      <table>
        <tr><th>Esfera</th><th>Dado</th></tr>
        <tr><td>🌍 Global 2025</td><td>~1 bilhão de adultos com obesidade (OMS)</td></tr>
        <tr><td>🌍 Global 2035</td><td><b>~1,9 bilhão</b> com obesidade — 51% da população com sobrepeso/obesidade (World Obesity Atlas 2023)</td></tr>
        <tr><td>🇧🇷 Adultos (VIGITEL 2023)</td><td>~22–24% obesidade nas capitais; ~57% sobrepeso</td></tr>
        <tr><td>🇧🇷 Crianças/adolescentes</td><td>~7–10% obesidade (POF/SISVAN)</td></tr>
      </table>
      <div class="warn">🚨 <b>Ponto de Atenção:</b> decore a projeção de 2035 — <b>~1,9 bilhão / 1 em 4 pessoas</b>.</div>
    `}
  ],
  quiz:[
    {q:"A obesidade foi reconhecida como doença crônica por quais entidades, e em que anos?",
     o:["OMS (1997) e AMA (2013)","Ministério da Saúde (2005) e CFM (2010)","IDF (2001) e SBC (2007)","OMS (2010) e AMA (2018)"],a:0,
     e:"OMS reconheceu em 1997 e a American Medical Association em 2013. É doença crônica, recidivante e progressiva."},
    {q:"Qual a projeção global de pessoas com obesidade para 2035?",
     o:["~500 milhões","~1 bilhão","~1,9 bilhão (1 em cada 4 pessoas)","~3 bilhões"],a:2,
     e:"World Obesity Atlas 2023: ~1,9 bilhão de pessoas com obesidade em 2035, cerca de 1 em cada 4."},
    {q:"Segundo o VIGITEL, qual a prevalência aproximada de obesidade em adultos nas capitais brasileiras?",
     o:["~8%","~22–24%","~40%","~55%"],a:1,
     e:"VIGITEL 2023: obesidade ~22–24% nas capitais; sobrepeso ~57%."},
    {q:"Qual característica NÃO faz parte da definição moderna de obesidade como doença?",
     o:["Crônica","Recidivante","Progressiva","Transmissível"],a:3,
     e:"Obesidade é crônica, recidivante e progressiva — não é transmissível (embora o ambiente obesogênico seja 'contagioso' socialmente)."},
    {q:"Em relação à epidemiologia pediátrica brasileira, a prevalência de obesidade em crianças é aproximadamente:",
     o:["1–2%","7–10%","20–25%","35%"],a:1,
     e:"POF/SISVAN apontam ~7–10% de obesidade em crianças e adolescentes brasileiros."}
  ]
},
{
  id:2, icon:"📏", color:"#a78bfa", title:"Avaliação Diagnóstica e Antropometria", prio:"r",
  sub:"IMC, CA, RCEst e novos critérios",
  content:[
    {h:"IMC — Fórmula e Classificação OMS (adultos)", b:`
      <p style="text-align:center;font-size:16px;font-weight:900;color:#a5b4fc;margin:8px 0">IMC = Peso (kg) ÷ Altura² (m²)</p>
      <table>
        <tr><th>IMC (kg/m²)</th><th>Classificação</th><th>Risco de Doença</th></tr>
        <tr><td>&lt; 18,5</td><td>Baixo peso</td><td>Baixo (outros riscos)</td></tr>
        <tr><td>18,5 – 24,9</td><td>Eutrofia</td><td>Normal</td></tr>
        <tr><td>25 – 29,9</td><td>Sobrepeso</td><td><b>Aumentado</b></td></tr>
        <tr><td>30 – 34,9</td><td>Obesidade Grau I</td><td>Moderado</td></tr>
        <tr><td>35 – 39,9</td><td>Obesidade Grau II</td><td>Grave</td></tr>
        <tr><td>≥ 40</td><td>Obesidade Grau III</td><td>Muito grave</td></tr>
      </table>
    `},
    {h:"Idosos (≥ 60 anos) e Pediatria", b:`
      <h4>Idosos — Ministério da Saúde</h4>
      <table>
        <tr><th>IMC</th><th>Classificação</th></tr>
        <tr><td>&lt; 22</td><td>Baixo peso</td></tr>
        <tr><td><b>22 – 27</b></td><td><b>Eutrofia (adequado)</b></td></tr>
        <tr><td>&gt; 27</td><td>Sobrepeso/Obesidade</td></tr>
      </table>
      <div class="warn">🚨 <b>Ponto de Atenção:</b> o ponto de corte do idoso <b>NÃO é o do adulto</b>. Eutrofia = <b>22 a 27</b>.</div>
      <h4>Pediatria — Escore Z (OMS)</h4>
      <table>
        <tr><th>Faixa</th><th>Sobrepeso</th><th>Obesidade</th><th>Obesidade grave</th></tr>
        <tr><td>0–5 anos</td><td>Z &gt; +2 e ≤ +3</td><td><b>Z &gt; +3</b></td><td>—</td></tr>
        <tr><td>5–19 anos</td><td>Z &gt; +1 e ≤ +2</td><td><b>Z &gt; +2</b></td><td>Z &gt; +3</td></tr>
      </table>
    `},
    {h:"Limitações do IMC — ponto a ponto", b:`
      <ul>
        <li>Não diferencia <b>massa magra de massa gorda</b> (atleta pode "ser obeso").</li>
        <li>Não avalia <b>distribuição de gordura</b> (central vs. periférica).</li>
        <li>Não reflete <b>saúde metabólica</b> (existe obeso metabolicamente saudável).</li>
        <li><b>Superestima</b> em idosos (sarcopenia) e <b>subestima</b> em obesos sarcopênicos.</li>
        <li>Não considera <b>etnia</b> (asiáticos têm risco com IMC menor).</li>

const KEY = "obesidade_sm_plataforma_v1";
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {xp:0, answers:{}, contentRead:{}, fcIndex:0, revealed:{}, streak:0};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function totalQuestions(){ return MISSIONS.reduce((a,m)=>a+m.quiz.length,0); }
function correctCount(){ return Object.values(S.answers).filter(a=>a.ok).length; }
function answeredCount(){ return Object.keys(S.answers).length; }
function missionAnswered(m){ return m.quiz.filter((_,i)=>S.answers[m.id+"-"+i]).length; }
function missionCorrect(m){ return m.quiz.filter((_,i)=>S.answers[m.id+"-"+i] && S.answers[m.id+"-"+i].ok).length; }
function missionDone(m){ return missionAnswered(m) === m.quiz.length; }

function computeXP(){
  let xp = 0;
  MISSIONS.forEach(m=>{
    m.quiz.forEach((_,i)=>{ const a=S.answers[m.id+"-"+i]; if(a && a.ok) xp += 10; });
    if(missionDone(m)) xp += 20;
  });
  return xp;
}
function maxXP(){
  let xp=0; MISSIONS.forEach(m=>{ xp += m.quiz.length*10 + 20; }); return xp;
}
function level(){ return Math.floor(computeXP()/100) + 1; }
function levelProgress(){
  const xp = computeXP() % 100; return xp;
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),450); }, 1900);
}

function confetti(n=70){
  const cols = ["#22d3ee","#a78bfa","#f472b6","#34d399","#fbbf24","#f87171","#60a5fa"];
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random()*100 + "vw";
    d.style.background = cols[Math.floor(Math.random()*cols.length)];
    d.style.animationDelay = (Math.random()*0.35)+"s";
    d.style.animationDuration = (1.7 + Math.random()*1.3)+"s";
    d.style.width = (6+Math.random()*7)+"px";
    d.style.height = (9+Math.random()*9)+"px";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3400);
  }
}

function header(){
  const xp = computeXP(), mx = maxXP();
  return `
  <div class="topbar"><div class="topbar-inner">
    <div class="brand"><span class="dot"></span> OBESIDADE &amp; SM</div>
    <div class="xpwrap">
      <div class="xpmeta"><span>XP ${xp} / ${mx}</span><span>${Math.round(xp/mx*100)}%</span></div>
      <div class="xpbar"><div class="xpfill" style="width:${xp/mx*100}%"></div></div>
    </div>
    <div class="lvl">🏆 Nível ${level()}</div>
  </div></div>`;
}

function nav(backLabel, backFn){
  if(!backLabel) return "";
  return `<div class="back"><button class="btn ghost sm" onclick="${backFn}">← ${backLabel}</button></div>`;
}

let view = {name:"home"};

function render(){
  const app = document.getElementById("app");
  let html = header();

  if(view.name === "home") html += homeHTML();
  else if(view.name === "mission") html += missionHTML(view.id, view.tab || "content");
  else if(view.name === "bonus") html += bonusHTML();
  else if(view.name === "cheatsheet") html += cheatsheetHTML();
  else if(view.name === "flashcards") html += flashcardsHTML();
  else if(view.name === "simulado") html += simuladoHTML();

  app.innerHTML = html;
  window.scrollTo({top:0,behavior:"instant"});

  // restore active quiz state
  if(view.name === "mission") hydrateQuiz(view.id);
}

/* ---------- MISSION ---------- */
function missionHTML(id, tab){
  const m = MISSIONS.find(x=>x.id===id);
  const prioLabel = m.prio==="r" ? "🔴 Alta prioridade" : m.prio==="y" ? "🟡 Média prioridade" : "🟢 Baixa prioridade";
  let body = "";

  if(tab === "content"){
    body = m.content.map(b=>`
      <div class="card">
        <h3>📖 ${b.h}</h3>
        ${b.b}
      </div>`).join("");
  } else if(tab === "quiz"){
    body = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div><b>${missionCorrect(m)} acertos</b> de ${m.quiz.length} questões</div>
      <div class="progress-dots">
        ${m.quiz.map((_,i)=>{
          const a = S.answers[m.id+"-"+i];
          return `<div class="pd ${a?(a.ok?'ok':'no'):''}"></div>`;
        }).join("")}
      </div>
    </div>` + m.quiz.map((q,i)=>quizHTML(m, q, i)).join("");
    if(missionDone(m)){
      body += `<div class="ok" style="text-align:center;font-size:14px">
        🎉 <b>Missão concluída!</b> Você respondeu todas as ${m.quiz.length} questões.
        ${missionCorrect(m)===m.quiz.length ? "Perfeito! 100% de acerto. 🏅" : "Revise as que errou e tente novamente no simulado."}
      </div>`;
    }
  } else {
    body = `<div class="card">
      <h3>💎 Dicas de Ouro — como o examinador cobra</h3>
      ${m.content.map(b=>`<div style="margin-bottom:12px">${(b.b.match(/<div class="(gold|warn|err|ok)">[\s\S]*?<\/div>/g)||[]).join("")}</div>`).join("")}
      <div class="gold">🧠 <b>Estratégia oral:</b> responda sempre na ordem <b>definição → critério → conduta</b>. Se travar, diga em voz alta: "o examinador quer que eu diferencie X de Y".</div>
    </div>`;
  }

  return `
  ${nav("Voltar ao mapa", "go('home')")}
  <div class="mission-head" style="--mc:${m.color}">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:30px">${m.icon}</div>
      <div>
        <h2>Missão ${m.id} — ${m.title}</h2>
        <p>${m.sub} · ${prioLabel}</p>
      </div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab ${tab==='content'?'on':''}" onclick="go('mission',${m.id},'content')">📖 Conteúdo</div>
    <div class="tab ${tab==='quiz'?'on':''}" onclick="go('mission',${m.id},'quiz')">🎯 Quiz (${m.quiz.length})</div>
    <div class="tab ${tab==='tips'?'on':''}" onclick="go('mission',${m.id},'tips')">💎 Dicas</div>
  </div>
  ${body}`;
}

function quizHTML(m, q, i){
  const key = m.id + "-" + i;
  const a = S.answers[key];
  const letters = ["A","B","C","D","E"];
  let opts = q.o.map((o,oi)=>{
    let cls = "";
    if(a){
      if(oi === q.a) cls = "correct";
      else if(oi === a.choice) cls = "wrong";
      else cls = "dim";
    }
    return `<button class="opt ${cls}" ${a?'disabled':''} onclick="answer(${m.id},${i},${oi})">
      <span class="ltr">${letters[oi]}</span><span>${o}</span>
    </button>`;
  }).join("");

  return `
  <div class="qbox" id="q-${key}">
    <div class="qhead">
      <span class="qnum">Q ${i+1}/${m.quiz.length}</span>
      <span class="qtext">${q.q}</span>
    </div>
    <div class="opts">${opts}</div>
    ${a ? `<div class="explain ${a.ok?'gold':''}">
      ${a.ok ? "✅ <b>Correto!</b> +10 XP" : "❌ <b>Incorreto.</b> A resposta correta é <b>"+letters[q.a]+"</b>."}
      <br>${q.e}
    </div>` : ""}
  </div>`;
}

function hydrateQuiz(){ /* nothing extra needed — rendered server-side */ }

function answer(mid, qi, choice){
  const m = MISSIONS.find(x=>x.id===mid);
  const key = mid + "-" + qi;
  if(S.answers[key]) return;
  const ok = choice === m.quiz[qi].a;
  S.answers[key] = {ok, choice};
  const wasDone = missionDone(m);
  save();
  render();
  if(ok) toast("+10 XP ✅");
  else toast("Resposta correta revelada ❌");
  if(!wasDone && missionDone(m)){
    setTimeout(()=>{ confetti(110); toast("🎉 Missão concluída! +20 XP"); }, 260);
  }
}

  </div>
  `;

function flipCard(){ fcFlipped = !fcFlipped; render(); }
function nextCard(){ fcPos = (fcPos+1) % fcDeck.length; fcFlipped = false; render(); }
function prevCard(){ fcPos = (fcPos-1+fcDeck.length) % fcDeck.length; fcFlipped = false; render(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- SIMULADO ---------- */
let sim = null, simTimer = null;

function buildSim(){
  const pool = [];
  MISSIONS.forEach(m=>m.quiz.forEach((q,i)=>pool.push({m,q,i})));
  shuffle(pool);
  return {
    qs: pool.slice(0,5),
    answers: {},
    submitted: false,
    timeLeft: 600
  };
}

function simuladoHTML(){
  if(!sim){ sim = buildSim(); startTimer(); }
  const t = sim.timeLeft;
  const mm = String(Math.floor(t/60)).padStart(2,"0");
  const ss = String(t%60).padStart(2,"0");
  const letters = ["A","B","C","D","E"];

  if(sim.submitted){
    const correct = sim.qs.filter((x,i)=> sim.answers[i] === x.q.a).length;
    return `
    ${nav("Voltar ao mapa", "go('home')")}
    <div class="hero" style="padding:10px 0 18px">
      <h1 style="font-size:26px">🎯 Resultado do Simulado</h1>
    </div>
    <div class="card" style="text-align:center;padding:28px">
      <div style="font-size:52px;font-weight:900;background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent">${correct}/5</div>
      <p style="margin-top:8px">${correct===5?"🏆 Perfeito! Você está pronto para o 10/10.":correct>=3?"💪 Bom desempenho — revise as que errou.":"📚 Revise as missões com calma antes da prova."}</p>
    </div>
    ${sim.qs.map((x,i)=>{
      const chosen = sim.answers[i];
      const ok = chosen === x.q.a;
      return `<div class="qbox">
        <div class="qhead">
          <span class="qnum" style="background:${ok?'rgba(52,211,153,.2)':'rgba(248,113,113,.2)'};color:${ok?'#6ee7b7':'#fca5a5'};border-color:${ok?'#34d399':'#f87171'}">${ok?'✔':'✘'} Q${i+1}</span>
          <span class="qtext">${x.q.q}</span>
        </div>
        <div class="opts">
          ${x.q.o.map((o,oi)=>{
            let cls = "";
            if(oi===x.q.a) cls="correct";
            else if(oi===chosen) cls="wrong";
            else cls="dim";
            return `<div class="opt ${cls}" style="cursor:default"><span class="ltr">${letters[oi]}</span><span>${o}</span></div>`;
          }).join("")}
        </div>
        <div class="explain ${ok?'gold':''}">${ok?"✅ <b>Correto!</b>":"❌ <b>Incorreto.</b>"}<br>${x.q.e}</div>
      </div>`;
    }).join("")}
    <div style="text-align:center;margin-top:16px">
      <button class="btn primary" onclick="restartSim()">🔁 Novo simulado</button>
    </div>`;
  }

  return `
  ${nav("Voltar ao mapa", "go('home')")}
  <div class="hero" style="padding:10px 0 16px">
    <h1 style="font-size:26px">🎯 Simulado Oral</h1>
    <p>5 questões aleatórias · sem feedback até o final</p>
  </div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div class="small" style="font-weight:800;letter-spacing:.6px">TEMPO RESTANTE</div>
      <div class="timer ${t<60?'danger':''}">${mm}:${ss}</div>
    </div>
    <div style="text-align:right">
      <div class="small">Respondidas</div>
      <div style="font-size:20px;font-weight:900">${Object.keys(sim.answers).length}/5</div>
    </div>
  </div>
  ${sim.qs.map((x,i)=>`
    <div class="qbox">
      <div class="qhead">
        <span class="qnum">Q ${i+1}</span>
        <span class="qtext">${x.q.q}</span>
      </div>
      <div class="opts">
        ${x.q.o.map((o,oi)=>`
          <button class="opt ${sim.answers[i]===oi?'correct':''}" onclick="simAnswer(${i},${oi})">
            <span class="ltr">${letters[oi]}</span><span>${o}</span>
          </button>`).join("")}
      </div>
    </div>`).join("")}
  <div style="text-align:center;margin:16px 0 30px">
    <button class="btn primary" onclick="submitSim()">✅ Finalizar simulado</button>
  </div>`;
}

function simAnswer(i, oi){
  if(!sim || sim.submitted) return;
  sim.answers[i] = oi;
  render();
}
function submitSim(){
  if(!sim) return;
  sim.submitted = true;
  clearInterval(simTimer);
  const correct = sim.qs.filter((x,i)=> sim.answers[i] === x.q.a).length;
  if(correct >= 4) { confetti(120); }
  render();
  toast(`Resultado: ${correct}/5`);
}
function restartSim(){
  clearInterval(simTimer);
  sim = null;
  render();
}
function startTimer(){
  clearInterval(simTimer);
  simTimer = setInterval(()=>{
    if(!sim || sim.submitted){ clearInterval(simTimer); return; }
    sim.timeLeft--;
    if(sim.timeLeft <= 0){ sim.timeLeft = 0; submitSim(); return; }
    if(view.name === "simulado" && !sim.submitted){
      // lightweight update of timer
      const el = document.querySelector(".timer");
      if(el){
        const mm = String(Math.floor(sim.timeLeft/60)).padStart(2,"0");
        const ss = String(sim.timeLeft%60).padStart(2,"0");
        el.textContent = mm+":"+ss;
        if(sim.timeLeft < 60) el.classList.add("danger");
      }
    }
  }, 1000);
}

/* ═══════════════════════════════════════════════════════════════
   NAVEGAÇÃO
   ═══════════════════════════════════════════════════════════════ */

function go(name, id, tab){
  if(name !== "simulado"){ clearInterval(simTimer); }
  view = {name, id, tab};
  if(name === "cheatsheet") csQuery = "";
  render();
}

function resetAll(){
  if(!confirm("Zerar todo o progresso?")) return;
  S = {xp:0, answers:{}, contentRead:{}, fcIndex:0, revealed:{}};
  save(); render(); toast("Progresso zerado 🔄");
}

/* FAB — revisão rápida */
document.getElementById("fab").addEventListener("click", ()=>{
  if(view.name !== "flashcards"){ fcDeck = null; }
  go("flashcards");
});

/* boot */
render();
</script>
